name: Deploy Next.js to Cloudflare Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: frontend/next
    env:
      CI: true
      APPURL: ${{ vars.APPURL }}
      APPNAME: ${{ vars.APPNAME }}
      APPDESCRIPTION: ${{ vars.APPDESCRIPTION }}
      APPAUTHOR: ${{ vars.APPAUTHOR }}
      NEXT_PUBLIC_APPURL: ${{ vars.NEXT_PUBLIC_APPURL }}
      NEXT_PUBLIC_APPNAME: ${{ vars.NEXT_PUBLIC_APPNAME }}
      NEXT_PUBLIC_APPDESCRIPTION: ${{ vars.NEXT_PUBLIC_APPDESCRIPTION }}
      NEXT_PUBLIC_APPAUTHOR: ${{ vars.NEXT_PUBLIC_APPAUTHOR }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_DEPLOY_ENV: ${{ vars.NEXT_PUBLIC_DEPLOY_ENV }}
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
      NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'EOF'
          const required = [
            'APPURL',
            'APPNAME',
            'APPDESCRIPTION',
            'APPAUTHOR',
            'NEXT_PUBLIC_APPURL',
            'NEXT_PUBLIC_APPNAME',
            'NEXT_PUBLIC_APPDESCRIPTION',
            'NEXT_PUBLIC_APPAUTHOR',
            'NEXT_PUBLIC_API_BASE_URL',
            'NEXT_PUBLIC_DEPLOY_ENV',
            'CLOUDFLARE_ACCOUNT_ID',
          ];

          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length > 0) {
            console.error(`Missing required configuration: ${missing.join(', ')}`);
            process.exit(1);
          }

          if (!process.env.CLOUDFLARE_API_TOKEN?.trim()) {
            console.error('Missing required configuration: CLOUDFLARE_API_TOKEN');
            process.exit(1);
          }

          if (process.env.NEXT_PUBLIC_DEPLOY_ENV !== 'staging') {
            console.error('Invalid configuration: NEXT_PUBLIC_DEPLOY_ENV must be staging');
            process.exit(1);
          }
          EOF

      - name: Prepare staging environment file
        run: |
          node -e "require('node:fs').writeFileSync('.env.staging', '', { mode: 0o600 })"

      - name: Run quality checks
        run: npm run check

      - name: Build static export for Cloudflare Staging
        run: npm run build:cf:staging

      - name: Verify static export artifacts
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/example/index.html
          test -f out/signin/index.html
          test -f out/dashboard/index.html
          test -f out/posts/index.html
          test -f out/posts/1/index.html
          test -f out/sitemap.xml
          test -f out/sw.js
          test -f out/offline.html
          find out/_next/static -type f -print -quit | grep -q .

      - name: Deploy to Cloudflare Staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --env staging

      - name: Cleanup staging environment file
        if: always()
        run: rm -f .env.staging
